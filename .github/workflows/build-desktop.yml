name: 打包桌面版 (Windows/macOS)

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 构建平台（windows / macos / both）
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - windows
          - macos
  push:
    tags: ['v*']

jobs:
  desktop-windows:
    name: Windows 桌面版
    runs-on: windows-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'both' || inputs.platforms == 'windows')) || github.event_name == 'push' }}
    env:
      WIN_SIGN_AVAILABLE: ${{ secrets.WIN_CODE_SIGN_BASE64 != '' }}
    # dispatch 与 tag 均可触发；签名步骤内部再按 secrets 是否配置决定
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装依赖
        run: |
          npm install --no-audit --no-fund
          npm install --prefix server --no-audit --no-fund

      - name: 构建 web 产物 (dist)
        run: node build.js

      - name: 编译 + 打包 NSIS (Tauri)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri
          npx @tauri-apps/cli@2 build --bundles nsis

      - name: 定位安装包
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Path "src-tauri/target/release/bundle" -Include *.exe,*.dmg,*.msi -ErrorAction SilentlyContinue | Select-Object FullName,Length

      # 仅当 secrets 存在且 signtool 可用时签名（证书未购买前此步骤自动跳过）
      - name: 代码签名 (Windows Authenticode + 时间戳)
        if: env.WIN_SIGN_AVAILABLE == 'true'
        shell: pwsh
        env:
          SIGNCERT_BASE64: ${{ secrets.WIN_CODE_SIGN_BASE64 }}
          SIGNCERT_PASS: ${{ secrets.WIN_CODE_SIGN_PASS }}
        run: |
          $b64 = $env:SIGNCERT_BASE64
          if ([string]::IsNullOrWhiteSpace($b64)) { Write-Output "未配置签名证书，跳过"; exit 0 }
          $pfx = Join-Path $env:TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($b64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Where-Object FullName -Match '\\x64\\' | Select-Object -First 1 -ExpandProperty FullName
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi | ForEach-Object {
            & $signtool sign /fd SHA256 /f $pfx /p $env:SIGNCERT_PASS /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "签名失败: $($_.FullName)"; exit 1 }
          }
          Remove-Item $pfx -Force

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: mindspeak-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: 打 tag 时发布到 Release（Windows 安装包）
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-macos:
    name: macOS 桌面版
    runs-on: macos-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'both' || inputs.platforms == 'macos')) || github.event_name == 'push' }}
    env:
      MAC_SIGN_AVAILABLE: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
      MAC_NOTARIZE_AVAILABLE: ${{ secrets.MAC_APPLE_ID != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装依赖
        run: |
          npm install --no-audit --no-fund
          npm install --prefix server --no-audit --no-fund

      - name: 构建 web 产物 (dist)
        run: node build.js

      - name: 编译 + 打包 DMG (Tauri)
        shell: bash
        run: |
          cd src-tauri
          npx @tauri-apps/cli@2 build --bundles dmg

      - name: 定位安装包
        run: |
          find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.app' \) | head -20

      # macOS 签名 + 公证（未配置 secrets 时自动跳过，仅打印不遮挡构建结果）
      - name: 签名 (Developer ID + hardened runtime)
        if: env.MAC_SIGN_AVAILABLE == 'true'
        env:
          MAC_DEVELOPER_ID_APPLICATION: ${{ secrets.MAC_DEVELOPER_ID_APP }}
          MAC_DEVELOPER_ID_INSTALLER: ${{ secrets.MAC_DEVELOPER_ID_INSTALLER }}
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_P12_PASS: ${{ secrets.MAC_CERT_P12_PASS }}
        run: |
          if [ -z "$MAC_CERT_P12_BASE64" ]; then echo "未配置签名, 跳过"; exit 0; fi
          echo "$MAC_CERT_P12_BASE64" | base64 -d > /tmp/cert.p12
          KEYCHAIN=/tmp/mindspeak.keychain-db
          security create-keychain -p temp /tmp/mindspeak.keychain || true
          security default-keychain -s /tmp/mindspeak.keychain
          security unlock-keychain -p temp /tmp/mindspeak.keychain
          security import /tmp/cert.p12 -k /tmp/mindspeak.keychain -P "$MAC_CERT_P12_PASS" -T /usr/bin/codesign -T /usr/bin/security || true
          security set-key-partition-list -S apple-tool:,apple: -s -k temp /tmp/mindspeak.keychain
          APP=$(find src-tauri/target/release/bundle -name '*.app' -depth 1 | head -1)
          codesign --force --options runtime --timestamp --sign "Developer ID Application" "$APP"
          codesign --verify --deep --strict "$APP" || true

      - name: 公证 (notarization) + 装订 (staple)
        if: env.MAC_NOTARIZE_AVAILABLE == 'true'
        env:
          MAC_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
          MAC_APPLE_PASSWORD: ${{ secrets.MAC_APPLE_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.MAC_APPLE_TEAM_ID }}
        run: |
          if [ -z "$MAC_APPLE_ID" ]; then echo "未配置公证, 跳过"; exit 0; fi
          DMG=$(find src-tauri/target/release/bundle -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then echo "无 DMG, 跳过公证"; exit 0; fi
          xcrun notarytool submit "$DMG" --wait \
            --apple-id "$MAC_APPLE_ID" \
            --password "$MAC_APPLE_PASSWORD" \
            --team-id "$MAC_APPLE_TEAM_ID" || true
          xcrun stapler staple "$DMG" || true
          spctl --assess --type open --context context:primary-signature --verbose "$DMG" || true

      - name: 上传 DMG
        uses: actions/upload-artifact@v4
        with:
          name: mindspeak-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: 打 tag 时发布到 Release（macOS 安装包）
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
