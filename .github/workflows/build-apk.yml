name: 打包安卓安装包 APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Java (Android 构建需要)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 安装 Android SDK (platform 36 + build-tools)
        uses: android-actions/setup-android@v3

      - name: 确认 Java 版本
        run: java -version 2>&1 | head -1

      # 失败时把 Gradle 错误摘要推送到 build-error-dump 分支，便于自动化读取
      - name: 打印 JDK 位置
        run: echo "JAVA_HOME=$JAVA_HOME"

      - name: 安装依赖 (terser + Capacitor)
        run: |
          npm install --no-audit --no-fund
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android

      - name: 构建 web 产物 (dist)
        run: node build.js

      - name: 初始化 Capacitor 工程
        run: |
          npx cap init "闻道 MindSpeak" com.mindspeak.app --web-dir=dist
          npx cap add android

      - name: 添加麦克风/音频权限 (跟读练习)
        run: |
          sed -i 's|<!-- Permissions -->|<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <!-- Permissions -->|' android/app/src/main/AndroidManifest.xml

      - name: 同步 web 产物到 Android
        run: npx cap sync android

      # 修复1: 强制 Gradle 使用 JDK21 (否则 gradle 可能用系统 JDK17 报 invalid source release: 21)
      # 修复2: 统一 Kotlin 版本到 1.8.22, 消除 kotlin-stdlib 与 kotlin-stdlib-jdk7/8 的重复类
      - name: 修复 Android 构建配置
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          {
            echo ""
            echo "configurations.all {"
            echo "    resolutionStrategy {"
            echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'"
            echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'"
            echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'"
            echo "    }"
            echo "}"
          } >> android/app/build.gradle
          echo "--- 已修复, 确认 JAVA_HOME ---"
          echo "org.gradle.java.home=$JAVA_HOME"

      - name: 把品牌图标放进 Android (从 Web PWA 图标生成各分辨率)
        run: |
          pipx run --spec pillow python - <<'EOF'
          from PIL import Image
          src = Image.open('dist/assets/pwa/icon-512.png').convert('RGBA')
          sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder, size in sizes.items():
              img = src.resize((size,size), Image.LANCZOS)
              img.save(f'android/app/src/main/res/{folder}/ic_launcher.png')
              img.save(f'android/app/src/main/res/{folder}/ic_launcher_round.png')
          EOF

      - name: 配置正式签名 (从 Secrets 还原 keystore)
        run: |
          set -e
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/mindspeak-keystore.p12
          file android/app/mindspeak-keystore.p12 || true
          ls -la android/app/mindspeak-keystore.p12
          test -s android/app/mindspeak-keystore.p12
          "$JAVA_HOME/bin/keytool" -list -storetype PKCS12 -v -keystore android/app/mindspeak-keystore.p12 -storepass "$ANDROID_KEYSTORE_PASS" 2>&1 | head -12
          cat >> android/app/build.gradle <<'EOF'

android {
    signingConfigs {
        release {
            storeFile file("mindspeak-keystore.p12")
            storePassword System.getenv('ANDROID_KEYSTORE_PASS')
            storeType "PKCS12"
            keyAlias System.getenv('ANDROID_KEY_ALIAS')
            keyPassword System.getenv('ANDROID_KEY_PASS')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
EOF
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}

      - name: 打出正式签名 Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace > gradle-build.log 2>&1
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            tail -120 gradle-build.log | sed 's/\x1b\[[0-9;]*m//g' > /tmp/gradle-err.txt
            cd "$GITHUB_WORKSPACE"
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" 2>/dev/null
            git config user.email "build-bot@users.noreply.github.com"
            git config user.name "build-bot"
            git checkout --orphan build-error-dump 2>/dev/null
            cp /tmp/gradle-err.txt build-error.txt
            git add build-error.txt
            git commit -m "gradle build error dump" --allow-empty
            git push origin build-error-dump --force 2>/dev/null
            echo "已推送错误摘要到 build-error-dump 分支"
            exit $exit_code
          fi

      - name: 上传 APK 作为工作流产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mindspeak-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/gradle-build.log
          if-no-files-found: warn

      - name: 打 tag 时发布到 Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: 闻道 MindSpeak ${{ github.ref_name }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}