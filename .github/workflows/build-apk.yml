name: 打包安卓安装包 APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Java (Android 构建需要)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 安装 Android SDK (platform 36 + build-tools)
        uses: android-actions/setup-android@v3

      - name: 确认 Java 版本
        run: java -version 2>&1 | head -1

      # 失败时把 Gradle 错误摘要推送到 build-error-dump 分支，便于自动化读取
      - name: 打印 JDK 位置
        run: echo "JAVA_HOME=$JAVA_HOME"

      - name: 安装依赖 (terser + Capacitor)
        run: |
          npm install --no-audit --no-fund
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android

      - name: 构建 web 产物 (dist)
        run: node build.js

      - name: 初始化 Capacitor 工程
        run: |
          npx cap init "闻道 MindSpeak" com.mindspeak.app --web-dir=dist
          npx cap add android

      - name: 加固 WebView 视口 + 媒体/沉浸式 (通用兼容所有安卓机型)
        run: |
          # 1) 部分 Android WebView 默认用"宽视口"(约 980px) 渲染页面，
          #    导致 @media(max-width:768px) 手机布局不生效、页面显示成桌面版。
          # 2) WebView 默认要求"用户手势后才允许播音频"→ 需关闭，否则 TTS/发音全无声。
          # 3) 默认主题带标题栏/状态栏 → 需沉浸式全屏 + 状态栏透明 overlay，消除"顶部一条杠"。
          MAIN=$(find android/app/src/main/java -name 'MainActivity.java' | head -1)
          echo "MainActivity: $MAIN"
          cat > "$MAIN" <<'EOF'
          package com.mindspeak.app;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.media.AudioManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView wv = getBridge().getWebView();
                  WebSettings s = wv.getSettings();
                  // 手机布局：关闭宽视口/概览模式，所有机型按设备宽度渲染
                  s.setUseWideViewPort(false);
                  s.setLoadWithOverviewMode(false);
                  s.setTextZoom(100);
                  // 声音：关闭"用户手势才允许播音频"，TTS/字母发音可直接出声
                  s.setMediaPlaybackRequiresUserGesture(false);
                  // 声音资源缓存 + 兼容性
                  s.setDomStorageEnabled(true);
                  s.setJavaScriptEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  // 音频焦点：请求系统媒体焦点，避免与系统铃声/其他 App 冲突
                  AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
                  if (am != null) {
                      am.requestAudioFocus(null, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK);
                  }
              }
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  // 沉浸式：隐藏系统状态栏/导航栏，消除"顶部一条杠"（全屏 App 体验）
                  if (hasFocus && Build.VERSION.SDK_INT >= 19) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN);
                  }
              }
          }
          EOF
          echo "--- 加固后 MainActivity ---"
          cat "$MAIN"

      - name: 沉浸式主题 + 状态栏透明 + 网络权限
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Capacitor 生成的 MainActivity 默认已用 @style/AppTheme.NoActionBar，
          # 此处只需把 styles.xml 覆盖为"沉浸式全屏 + 状态栏透明"，消除"顶部一条杠"。
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#F4F6F8</item>
                  <item name="colorPrimaryDark">#F4F6F8</item>
                  <item name="colorAccent">#7BA9CE</item>
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:windowTranslucentStatus">true</item>
                  <item name="android:windowTranslucentNavigation">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="AppTheme"/>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar"/>
          </resources>
          EOF
          # 允许明文流量（本地 http / file 资源加载声音）
          grep -q 'usesCleartextTraffic' "$MANIFEST" || sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          echo "--- styles.xml ---"
          cat android/app/src/main/res/values/styles.xml
          echo "--- manifest 关键行 ---"
          grep -E 'MainActivity|application|usesCleartextTraffic|NoActionBar' "$MANIFEST"


      - name: 添加麦克风/音频权限 (跟读练习)
        run: |
          sed -i 's|<!-- Permissions -->|<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <!-- Permissions -->|' android/app/src/main/AndroidManifest.xml

      - name: 同步 web 产物到 Android
        run: npx cap sync android

      # 修复1: 强制 Gradle 使用 JDK21 (否则 gradle 可能用系统 JDK17 报 invalid source release: 21)
      # 修复2: 统一 Kotlin 版本到 1.8.22, 消除 kotlin-stdlib 与 kotlin-stdlib-jdk7/8 的重复类
      - name: 修复 Android 构建配置
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          {
            echo ""
            echo "configurations.all {"
            echo "    resolutionStrategy {"
            echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'"
            echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'"
            echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'"
            echo "    }"
            echo "}"
          } >> android/app/build.gradle
          echo "--- 已修复, 确认 JAVA_HOME ---"
          echo "org.gradle.java.home=$JAVA_HOME"

      - name: 把品牌图标放进 Android (从 Web PWA 图标生成各分辨率)
        run: |
          pipx run --spec pillow python - <<'EOF'
          from PIL import Image
          src = Image.open('dist/assets/pwa/icon-512.png').convert('RGBA')
          sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder, size in sizes.items():
              img = src.resize((size,size), Image.LANCZOS)
              img.save(f'android/app/src/main/res/{folder}/ic_launcher.png')
              img.save(f'android/app/src/main/res/{folder}/ic_launcher_round.png')
          EOF

      - name: 配置正式签名 (从 Secrets 还原 keystore)
        run: |
          set -e
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/mindspeak-keystore.p12
          ls -la android/app/mindspeak-keystore.p12
          test -s android/app/mindspeak-keystore.p12
          cat >> android/app/build.gradle <<'EOF'
          
          android {
              signingConfigs {
                  release {
                      storeFile file("mindspeak-keystore.p12")
                      storePassword System.getenv('ANDROID_KEYSTORE_PASS')
                      storeType "PKCS12"
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASS')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}

      - name: 打出正式签名 Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace > gradle-build.log 2>&1
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            tail -120 gradle-build.log | sed 's/\x1b\[[0-9;]*m//g' > /tmp/gradle-err.txt
            cd "$GITHUB_WORKSPACE"
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" 2>/dev/null
            git config user.email "build-bot@users.noreply.github.com"
            git config user.name "build-bot"
            git checkout --orphan build-error-dump 2>/dev/null
            cp /tmp/gradle-err.txt build-error.txt
            git add build-error.txt
            git commit -m "gradle build error dump" --allow-empty
            git push origin build-error-dump --force 2>/dev/null
            echo "已推送错误摘要到 build-error-dump 分支"
            exit $exit_code
          fi

      - name: 上传 APK 作为工作流产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mindspeak-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/gradle-build.log
          if-no-files-found: warn

      - name: 重命名 APK 为平台明确文件名
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk "MindSpeak-Android-${{ github.ref_name }}.apk"
          ls -la MindSpeak-Android-*.apk

      - name: 打 tag 时发布到 Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: MindSpeak-Android-${{ github.ref_name }}.apk
          name: 闻道 MindSpeak ${{ github.ref_name }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}