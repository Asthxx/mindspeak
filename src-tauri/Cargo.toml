[package]
name = "mindspeak"
version = "1.1.0"
description = "闻道 MindSpeak 桌面版"
authors = ["Asthxx"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mindspeak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]