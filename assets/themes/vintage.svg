<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C98267"/>
      <stop offset="0.5" stop-color="#9C7A4A"/>
      <stop offset="1" stop-color="#5E5340"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2A1E12" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.12"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" filter="url(#grain)" opacity="0.9"/>
  <g fill="none" stroke="#F6F1E7" stroke-width="2" opacity="0.4">
    <path d="M0 180 C 200 220, 400 130, 800 200"/>
    <path d="M0 320 C 250 360, 480 260, 800 330"/>
  </g>
  <g fill="#EAE2D2" opacity="0.6">
    <circle cx="200" cy="120" r="4"/><circle cx="620" cy="160" r="3"/>
    <circle cx="340" cy="420" r="3.5"/><circle cx="560" cy="480" r="4"/>
  </g>
  <rect width="800" height="600" fill="url(#vig)"/>
</svg>