<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7BA9CE"/>
      <stop offset="100%" stop-color="#3E5F7F"/>
    </linearGradient>
    <linearGradient id="bubble" x1="130" y1="140" x2="380" y2="340" gradientUnits="userSpaceOnUse">
