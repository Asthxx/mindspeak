      <stop offset="100%" stop-color="#EEF4F9"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9A76"/>
      <stop offset="100%" stop-color="#FF8A65"/>
    </linearGradient>
  </defs>
  <!-- 背景圆角方形 -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
